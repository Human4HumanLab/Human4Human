name: Agente implementatore
on:
  issues:
    types: [labeled]
concurrency:
  group: agente-${{ github.event.issue.number }}
jobs:
  implementa:
    if: github.event.label.name == 'fase:implementazione'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Leggi modello del ruolo
        id: model
        run: echo "value=$(jq -r '.implementer' .claude/models.json)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: |
            Implementa il piano approvato nell'issue
            #${{ github.event.issue.number }}. Rispetta AGENTS.md.
            Crea un branch ucNN-nome, esegui mvn -q verify, poi
            apri una PR in bozza (gh pr create --draft) con
            "Closes #${{ github.event.issue.number }}" e il template.
          claude_args: >-
            --model ${{ steps.model.outputs.value }}
            --max-turns 40
            --allowedTools Read Edit Write Glob Grep
            "Bash(mvn:*)" "Bash(git:*)"
            "Bash(gh issue view:*)" "Bash(gh pr create:*)"
